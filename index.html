<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Ecommerce</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header>
      <div class="logo">Daniel</div>
     
      <h1 class="titulo">Mini Ecommerce</h1>
      
      <div class="header-busca">
        <input type="text" id="search" class="header-input" placeholder="Buscar...">
        <button class="header-btn">Buscar</button>
      </div>
    </header>
    <section>
        <nav>
            <ul class="menu-lateral">
                <li>
                    <a href="#">
                        <div class="opcao">
                            <div class="icone-inicial">
                            </div>
                            <div class="rotulo">categorias</div>
                            <div class="icone-final"></div>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <div class="opcao">
                            <div class="icone-inicial"></div>
                        
                            <div class="rotulo">ofertas</div>
                            <div class="icone-final"></div>
                            
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <div class="opcao">
                            <div class="icone-inicial"></div>
                            <div class="rotulo">mensagem</div>
                            <div class="icone-final"></div>
                        </div>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <div class="opcao">
                            <div class="icone-inicial">
                            </div>
                            <div class="rotulo">Sair</div>
                            <div class="icone-final"></div>
                            
                        </div>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="main-content">
          
          <div class="filter-bar">
            <div class="filter-group">
              <label id="label-category" class="filter-label">Filtrar por categoria:</label>
              <select id="category" class="category-select">
                <option value="Todas">Todas</option>
              </select>
            </div>
            <button id="btnRender" class="btn-render">Renderizar</button>
          </div>

          <main id="product-list" class="container"></main>

          <div id="product-details" class="product-details"></div>

        </div>
    </section>

    <footer>&copy; Meu Site de E-commerce </footer>
    
    <script src="script.js"></script>
  </body>
</html>
